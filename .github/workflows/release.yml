# Release steps around the npm stage publish workflow.
#   bump-version:  opens a PR that bumps every package with `lerna version <bump>`
#   -- merge it, run "npm stage publish", approve the packages on npm --
#   bump-web-ui:   opens a PR that moves apps/web-ui to the new @stamp-lib/* version
#   draft-release: after that PR is merged, creates a draft GitHub Release (tag vX.Y.Z)
#
# Jobs that run dependency code (lerna, npm install, tsc) are read-only. The jobs that push and
# open PRs install only the release scripts and never take files from them as-is: the version bump
# patch is checked field by field (apply-version-bump.mjs), and the web-ui manifests are regenerated
# and must match the tested ones (bump-web-ui.mjs update). See docs/development/release.md.
name: release

on:
  workflow_dispatch:
    inputs:
      step:
        description: Release step to run
        type: choice
        required: true
        options:
          - bump-version
          - bump-web-ui
          - draft-release
      bump:
        description: Version bump (bump-version only; same names as the versionup:* scripts)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - rc
          - patch-rc
          - minor-rc
          - major-rc

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump version
    if: inputs.step == 'bump-version'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - run: npm ci
      - run: node scripts/release/bump-version.mjs "$BUMP" "$RUNNER_TEMP/version-bump.patch"
        env:
          BUMP: ${{ inputs.bump }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-bump
          path: ${{ runner.temp }}/version-bump.patch
          if-no-files-found: error
          retention-days: 1

  open-version-pr:
    name: Open version bump PR
    needs: bump-version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-bump
          path: ${{ runner.temp }}/version-bump
      - run: node scripts/release/apply-version-bump.mjs "$RUNNER_TEMP/version-bump/version-bump.patch"
      - run: node scripts/release/open-pr.mjs version-bump
        env:
          GH_TOKEN: ${{ github.token }}

  bump-web-ui:
    name: Bump web-ui
    if: inputs.step == 'bump-web-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compared with the commit the packages were built from
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - run: node scripts/release/bump-web-ui.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-manifests
          path: |
            apps/web-ui/package.json
            apps/web-ui/package-lock.json
          if-no-files-found: error
          retention-days: 1

  open-web-ui-pr:
    name: Open web-ui bump PR
    needs: bump-web-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compared with the commit the packages were built from
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-manifests
          path: ${{ runner.temp }}/web-ui-manifests
      - run: node scripts/release/bump-web-ui.mjs update "$RUNNER_TEMP/web-ui-manifests"
      - run: node scripts/release/open-pr.mjs web-ui
        env:
          GH_TOKEN: ${{ github.token }}

  draft-release:
    name: Create draft GitHub Release
    if: inputs.step == 'draft-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compared with the commit the packages were built from
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - run: node scripts/release/draft-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
