# Builds every publishable @stamp-lib package from main and stages it on npm with
# `npm stage publish` (trusted publishing over OIDC, provenance included). Nothing becomes
# public until a maintainer approves each staged version on npmjs.com (or `npm stage approve`)
# with 2FA. See docs/development/release.md.
#
# Dependency code (lerna, tsc, ...) never runs in the job that can mint an npm OIDC token:
#   build: npm ci + build + npm pack       (contents: read)
#   stage: npm stage publish <tarball>     (id-token: write, only the release scripts installed)
name: npm stage publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/release/pack.mjs "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage packages on npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/release-setup
        with:
          allowed-actors: ${{ vars.NPM_RELEASE_ACTORS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      - run: node scripts/release/stage.mjs "$RUNNER_TEMP/tarballs"
